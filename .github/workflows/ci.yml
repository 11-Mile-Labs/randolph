name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Harness and desktop unit tests
        run: pnpm -r --filter '!@randolph/runtime' test
      - name: Isolated experiment checks
        working-directory: experiments/controlled-run
        run: |
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
      - name: Runtime tests
        working-directory: packages/runtime
        # These isolated fixtures spend much of their time waiting on Git/child
        # processes. The runner's CPU-based default unnecessarily serializes them.
        run: node --test --test-concurrency=8 test/*.test.mjs

  desktop:
    name: Desktop acceptance
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Desktop acceptance tests
        # Run independently of the long runtime suite and stop at the first failure.
        # Test and assertion budgets live in apps/desktop/playwright.config.ts.
        run: pnpm --filter @randolph/desktop exec playwright test --max-failures=1
